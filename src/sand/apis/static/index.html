<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAND</title>
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@25/dist/keycloak.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="app-bar">
    <h1>SAND</h1>
    <div class="app-bar-right" id="auth-area"></div>
  </div>

  <div class="container">
    <div id="login-prompt">
      <p>Log in with your NOMAD account to use SAND.</p>
      <button class="btn btn-primary" id="login-btn">
        <span class="material-icons">login</span>
        Log in
      </button>
    </div>

    <div id="app-content">
      <div class="card">
        <label class="text-field-label" for="experiment-select">Experiment</label>
        <div class="controls" style="margin-top: 0;">
          <select class="select-field" id="experiment-select">
            <option value="">— select an experiment —</option>
          </select>
          <button class="btn btn-outlined" id="new-experiment-btn" type="button">
            <span class="material-icons">add</span>
            New experiment
          </button>
          <a id="experiment-link" target="_blank" rel="noopener noreferrer" hidden>View in NOMAD</a>
        </div>

        <div id="new-experiment-form" hidden>
          <hr class="divider">
          <div class="form-grid">
            <label>Project name <input class="form-input" id="exp-project"></label>
            <label>Batch <input class="form-input" id="exp-batch"></label>
            <label>Subbatch <input class="form-input" id="exp-subbatch"></label>
            <label>First sample <input class="form-input" id="exp-first-sample"></label>
            <label>Number of samples <input class="form-input" id="exp-n-samples" type="number" min="1"></label>
            <label>Substrate material <input class="form-input" id="exp-substrate-material" value="Glass"></label>
            <label>Substrate conductive layer <input class="form-input" id="exp-substrate-conductive-layer" value="ITO"></label>
            <label>Number of pixels <input class="form-input" id="exp-number-of-pixels" type="number" min="1" value="6"></label>
            <label>Sample dimension <input class="form-input" id="exp-sample-dimension" placeholder="optional"></label>
            <label>Sample area [cm&sup2;] <input class="form-input" id="exp-sample-area" type="number" step="any" placeholder="optional"></label>
            <label>Pixel area [cm&sup2;] <input class="form-input" id="exp-pixel-area" type="number" step="any" placeholder="optional"></label>
            <label>Sheet resistance [Ohms/square] <input class="form-input" id="exp-sheet-resistance" type="number" step="any" placeholder="optional"></label>
            <label>Transmission [%] <input class="form-input" id="exp-transmission" type="number" step="any" placeholder="optional"></label>
            <label>Number of junctions <input class="form-input" id="exp-number-of-junctions" type="number" min="1" placeholder="optional"></label>
          </div>
          <div class="controls">
            <button class="btn btn-primary" id="create-experiment-btn" type="button">Create</button>
            <button class="btn btn-outlined" id="cancel-experiment-btn" type="button">Cancel</button>
          </div>
        </div>

        <hr class="divider">

        <label class="text-field-label" for="text">Input text</label>
        <textarea class="text-field" id="text" placeholder="Type a step note here and save it to the selected experiment, or record audio."></textarea>

        <div class="controls">
          <button class="btn btn-primary" id="record-btn">
            <span class="material-icons">mic</span>
            Record
          </button>
          <button class="btn btn-outlined" id="upload-btn" type="button">
            <span class="material-icons">upload_file</span>
            Upload audio file
          </button>
          <button class="btn btn-outlined" id="save-note-btn" type="button">
            <span class="material-icons">note_add</span>
            Save note
          </button>
          <input type="file" id="upload-input" accept="audio/wav,audio/mp3,audio/mpeg,audio/mp4,audio/x-m4a,audio/webm,audio/ogg,audio/flac" hidden>
          <span class="status-text" id="status"></span>
        </div>

        <p class="audio-entry-text" id="audio-entry"></p>

        <hr class="divider">

        <div class="controls">
          <button class="btn btn-secondary" id="extract-btn" type="button">
            <span class="material-icons">science</span>
            Extract hysprint experiment
          </button>
          <span class="status-text" id="extract-status"></span>
        </div>

        <p class="error-text" id="error" role="alert"></p>
      </div>

      <div class="card" id="extract-result" hidden>
        <div class="results-title">Extracted experiment</div>
        <p class="audio-entry-text" id="derived-entry"></p>
        <p class="status-text" id="extract-summary"></p>
        <p class="error-text" id="sheet-issues"></p>
        <details>
          <summary>Archive JSON</summary>
          <pre id="extract-json"></pre>
        </details>
      </div>
    </div>
  </div>

  <script src="static/app.js" defer></script>
</body>
</html>
